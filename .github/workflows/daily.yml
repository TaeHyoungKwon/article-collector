name: daily-collect

on:
  schedule:
    # 매일 KST 08:00 = UTC 23:00 (전일)
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "dry-run (메일 발송 안 함)"
        type: boolean
        default: false

permissions:
  contents: write
  models: read

concurrency:
  # shared with collect.yml so vault writes never overlap
  group: vault-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run pipeline
        env:
          # GitHub Models — uses the workflow's auto-provided GITHUB_TOKEN
          # thanks to `permissions: models: read` above.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          OBSIDIAN_VAULT_NAME: ${{ secrets.OBSIDIAN_VAULT_NAME }}
          KEYWORDS: ${{ secrets.KEYWORDS }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            uv run python -m src.main --dry-run -v
          else
            uv run python -m src.main -v
          fi

      - name: Upload dry-run artifact
        if: ${{ inputs.dry_run == true }}
        uses: actions/upload-artifact@v4
        with:
          name: dryrun_mail
          path: dryrun_mail.html
          if-no-files-found: ignore

      - name: Commit vault changes
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vault/articles vault/_index.md
          if git diff --cached --quiet; then
            echo "No vault changes to commit."
          else
            git commit -m "chore(vault): daily collect $(date -u +%Y-%m-%d) [skip ci]"
            # Pull any commits pushed since checkout (e.g. by collect.yml or a manual
            # local push). --autostash keeps unstaged runtime changes (uv.lock etc.)
            # from blocking the rebase.
            git pull --rebase --autostash origin main
            git push
          fi
